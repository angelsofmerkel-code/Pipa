name: Build APK

on:
  push:
    branches: [master, main]
    paths-ignore: ["strategies/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK / NDK / CMake
        continue-on-error: true
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -path "*bin/sdkmanager" | head -n1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PstrategiesRepo=${{ github.repository }} \
            -PstrategiesBranch=${{ github.ref_name }}

      - name: Collect APK
        run: |
          mkdir -p out
          APK=$(find app/build/outputs/apk/release -name "*universal*.apk" | head -n1)
          [ -z "$APK" ] && APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          cp "$APK" out/AutoDpiTv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AutoDpiTv-apk
          path: out/AutoDpiTv.apk

      - name: Publish release (stable download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: out/AutoDpiTv.apk
          make_latest: true
